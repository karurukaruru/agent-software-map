name: Release

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: asm-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate release contents
        run: python scripts/validate.py
      - name: Publish versioned release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const version = fs.readFileSync('VERSION', 'utf8').trim();
            if (!/^[0-9]+\.[0-9]+\.[0-9]+$/.test(version)) {
              throw new Error('VERSION must contain a stable semantic version');
            }
            const tag = `v${version}`;
            const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
            const heading = `## [${version}] - `;
            const start = changelog.indexOf(heading);
            if (start < 0) throw new Error('Missing version section in CHANGELOG.md');
            const bodyStart = changelog.indexOf('\n', start) + 1;
            const next = changelog.indexOf('\n## [', bodyStart);
            const body = changelog.slice(bodyStart, next < 0 ? undefined : next).trim();
            if (!body) throw new Error('Release notes are empty');
            const repo = context.repo;
            // Never move a published tag or overwrite an existing release.
            let tagExists = false;
            try {
              await github.rest.git.getRef({...repo, ref: `tags/${tag}`});
              tagExists = true;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (tagExists) {
              try {
                const {data} = await github.rest.repos.getReleaseByTag({...repo, tag});
                core.notice(`Release already exists: ${data.html_url}`);
                return;
              } catch (error) {
                if (error.status !== 404) throw error;
                throw new Error('Tag exists without a release; inspect it before publishing');
              }
            }
            const {data} = await github.rest.repos.createRelease({
              ...repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: `Agent Software Map ${tag}`,
              body,
              draft: false,
              prerelease: false,
              make_latest: 'true'
            });
            core.notice(`Published ${data.html_url} at ${context.sha}`);
