name: ASM 改进建议
description: 建议新增能减少探索、误判、失败或风险的知识
title: "[建议] "
labels: ["enhancement"]
body:
  - type: textarea
    id: gap
    attributes:
      label: 当前知识缺口
      description: 如果不补充这项内容，Agent 很可能会猜错、选错工具、误报成功或产生什么风险？
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 适用版本与环境
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 可用证据与验证方法
      description: 区分已验证、文档依据、推断和未知。
    validations:
      required: true
