name: ASM 错误报告
description: 报告会导致 Agent 误判、失败或产生风险的 ASM 内容
title: "[错误] "
labels: ["bug"]
body:
  - type: input
    id: software
    attributes:
      label: 软件与版本
      placeholder: 例如 Adobe After Effects 25.x
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 平台与环境
      placeholder: 操作系统、界面语言、插件或控制通道
    validations:
      required: true
  - type: textarea
    id: location
    attributes:
      label: 受影响位置
      description: 指明 ASM 文件、章节、对象、状态或操作契约。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 观察结果与证据
      description: 说明预期、实际结果、证据等级和复现条件。请先移除敏感信息。
    validations:
      required: true
  - type: textarea
    id: recovery
    attributes:
      label: 已知恢复方式
      description: 如果操作失败或部分完成，请说明如何恢复到可控状态。
